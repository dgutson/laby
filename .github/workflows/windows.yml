name: Native Windows

on:
  push:
    branches:
      - master
      - windows-native
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up native OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.14"
          windows-compiler: mingw
          windows-environment: msys2

      - name: Install dependencies
        shell: pwsh
        run: |
          .\prepare-windows-deps.ps1
          opam install . --deps-only --yes

      - name: Build native executable
        shell: pwsh
        run: .\build-windows.ps1 -SkipDependencies

      - name: Verify build layout
        shell: pwsh
        run: |
          if (-not (Test-Path .\dist\windows\laby.exe)) {
            throw "Missing dist\windows\laby.exe"
          }
          if (-not (Test-Path .\dist\windows\data\levels\0.laby)) {
            throw "Missing runtime data"
          }

      - name: Smoke-test executable and resource lookup
        shell: pwsh
        run: |
          Push-Location .\dist\windows
          try {
            $originalPath = $env:PATH
            $env:PATH = "$PWD;$env:SystemRoot;$env:SystemRoot\System32"
            $env:CAML_LD_LIBRARY_PATH = ""
            try {
              .\laby.exe --version
              $env:GDK_PIXBUF_MODULEDIR =
                "$PWD\lib\gdk-pixbuf-2.0\loaders"
              $loaderFiles = Get-ChildItem `
                -LiteralPath $env:GDK_PIXBUF_MODULEDIR `
                -Filter "*.dll" -File |
                Select-Object -ExpandProperty FullName
              $loaders = & .\gdk-pixbuf-query-loaders.exe @loaderFiles
              if ($LASTEXITCODE -ne 0) {
                throw "Could not inspect the bundled Pixbuf loaders"
              }
              if ($loaders -notmatch "svg") {
                throw "The standalone package is missing its SVG loader"
              }
            }
            finally {
              $env:PATH = $originalPath
            }
          }
          finally {
            Pop-Location
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: laby-windows-x64
          path: dist/windows
          if-no-files-found: error
          retention-days: 30
